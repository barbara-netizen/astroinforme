# Configuración para publicar con Wrangler o con Cloudflare Builds (repositorio conectado).
# Las variables y los secretos se administran en el panel de Cloudflare: keep_vars evita que un despliegue los borre.
name = "astroinforme"
main = "src/entry.js"
compatibility_date = "2026-10-01"
keep_vars = true

[[kv_namespaces]]
binding = "ASTRO_KV"
id = "3fe6f27f5f3844df8f90d1e9790291da"

# Generación desacoplada de la conexión (servicio 1.6): un Durable Object por pedido, con almacenamiento SQLite
# (el único disponible en el plan gratuito). La migración se aplica una sola vez, en el primer despliegue.
[[durable_objects.bindings]]
name = "REPORT_JOB"
class_name = "ReportJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportJob"]

# Cupo por código con reserva atómica (servicio 1.7): un Durable Object por código.
[[durable_objects.bindings]]
name = "CODE_LEDGER"
class_name = "CodeLedger"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CodeLedger"]

# Límite de frecuencia (servicio 1.7.1): 6 pedidos que generan o escriben por minuto y por código (o por visitante sin
# código). Es aproximado y se cuenta por ubicación de Cloudflare; el cupo atómico sigue en CODE_LEDGER.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Control periódico de pedidos pagos: reintentos, conciliación, avisos y resumen. Fuera del modo "paid" no hace nada.
[triggers]
crons = ["*/15 * * * *"]

# Pedidos pagos (servicio 2.0): un Durable Object por pedido. Solo se usan con SERVICE_MODE = "paid".
[[durable_objects.bindings]]
name = "ORDERS"
class_name = "OrderDO"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OrderDO"]
